name: Release macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app with PyInstaller
        run: |
          pyinstaller --windowed --onefile \
            --name "RekordboxGenerator" \
            --icon NONE \
            --add-data "requirements.txt:." \
            rekordbox_generator.py

      - name: Package .app
        run: |
          mkdir -p release
          if [ -d "dist/RekordboxGenerator.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/RekordboxGenerator.app" "release/RekordboxGenerator-mac.zip"
          else
            if [ -f "dist/RekordboxGenerator" ]; then
              tar -czf release/RekordboxGenerator-mac-cli.tgz -C dist RekordboxGenerator
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


