name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'rekordbox_generator.py'
      - 'requirements.txt'
      - 'RekordboxGenerator.spec'
      - '.github/workflows/build-macos.yml'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app with PyInstaller (spec)
        run: |
          pyinstaller --noconfirm RekordboxGenerator.spec

      - name: Package .app for distribution
        run: |
          mkdir -p release
          if [ -d "dist/RekordboxGenerator.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/RekordboxGenerator.app" "release/RekordboxGenerator-mac.zip"
          else
            # onefile builds on macOS still produce .app when windowed=false; ensure packaging
            if [ -f "dist/RekordboxGenerator" ]; then
              tar -czf release/RekordboxGenerator-mac-cli.tgz -C dist RekordboxGenerator
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RekordboxGenerator-mac
          path: release/*
          if-no-files-found: error


